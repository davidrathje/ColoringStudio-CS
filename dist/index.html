<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Page</title>
</head>
<body>
    <h1>ColoringStudio-CS</h1>
    <div id="audit-log" style="border:1px solid red; padding: 20px; font-family: monospace;">
        System: Initializing...
    </div>

    <script>
        const log = document.getElementById('audit-log');
        log.innerHTML += "<br>Status: Script loaded and running.";
        
        // Testa inbox
        fetch('./data/inbox.json')
            .then(res => res.json())
            .then(data => {
                log.innerHTML += "<br>Inbox: Data successfully fetched!";
            })
            .catch(err => {
                log.innerHTML += "<br>Inbox Error: " + err.message;
            });
    </script>
</body>
</html>
