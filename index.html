<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ColorMatchStudio | Production</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        button { width: 100%; padding: 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .audit-log { margin-top: 20px; padding: 10px; background: #1e1e1e; color: #00ff00; border-radius: 5px; font-family: monospace; font-size: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>ColorMatchStudio</h1>
        <button id="run-rc1">Execute & Audit RC1</button>
        <div id="audit-log" class="audit-log">System: Initializing...</div>
    </div>

    <script type="module">
        import { drawCombinedPlanPng } from './src/printRenderer.js';

        const log = document.getElementById('audit-log');

        window.onerror = function(message, source, lineno, colno, error) {
            log.innerHTML += `<br><span style="color:red;">Error: ${message}</span>`;
        };

        async function checkInbox() {
    const log = document.getElementById('audit-log');
    try {
        // Vi lägger till ?t=TIMESTAMP i slutet av URL:en för att lura cachen
        const timestamp = new Date().getTime();
        const response = await fetch(`./data/inbox.json?t=${timestamp}`);
        
        if (!response.ok) throw new Error(`Status: ${response.status}`);
        
        const data = await response.json();
        const latest = data.inbox[data.inbox.length - 1];
        
        log.innerHTML += `<br>Inbox: ${JSON.stringify(latest.data)}`;
    } catch (error) {
        log.innerHTML += `<br>Inbox-fel: ${error.message}`;
    }
}


        // Trigga vid laddning
        window.addEventListener('DOMContentLoaded', () => {
            checkInbox();
        });

        document.getElementById('run-rc1').addEventListener('click', async () => {
            log.innerHTML = "Audit: Fetching data...<br>";
            try {
                const response = await fetch('./data/medium/Ohuhu_Master.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const cleanData = rawData
                    .filter(item => item.Status === 'VERIFIED' && item.Kod && item.Namn)
                    .map(item => ({ Code: item.Kod, Name: item.Namn, Hex: item.Hex || "#CCCCCC" }));

                log.innerHTML += `Audit: Processed ${cleanData.length} items.<br>`;
                
                const canvas = drawCombinedPlanPng(cleanData);
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a5');
                doc.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 10, 10, 128, 190);
                doc.save('RC1_Production.pdf');
                
                log.innerHTML += "System: Export complete.";
            } catch (error) {
                log.innerHTML += `<br><span style="color:red;">Critical: ${error.message}</span>`;
            }
        });
    </script>
</body>
</html>
